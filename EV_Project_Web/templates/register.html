<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>EV Registration</title>

  <!-- Vendor CSS -->
  <link href="static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="static/vendor/aos/aos.css" rel="stylesheet">

  <!-- Main CSS -->
  <link href="static/css/main.css" rel="stylesheet">
</head>

<body class="service-details-page">

<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid container-xl d-flex align-items-center justify-content-between">
    <a href="/" class="logo d-flex align-items-center">
      <h1 class="sitename">EV Analytics</h1>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#dashboard">Dashboard</a></li>
        <li><a href="/register" class="active">Register</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="main">

  <div class="page-title light-background">
    <div class="container">
      <h1>User Registration</h1>
    </div>
  </div>

  <section class="service-details section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">

          <div class="card p-4 shadow">
            <h3 class="text-center mb-4">Register for EV Dashboard</h3>

            <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">
            <input type="email" id="email" class="form-control mb-3" placeholder="Email">
            <input type="text" id="mobile" class="form-control mb-3" placeholder="Mobile Number">

            <button class="btn btn-success w-100 mb-3" onclick="sendOTP()">Send OTP</button>

            <input type="text" id="otp" class="form-control mb-3" placeholder="Enter OTP">

            <button class="btn btn-primary w-100" onclick="verifyOTP()">Verify & Register</button>

            <p id="msg" class="text-center mt-3 fw-bold"></p>
          </div>

        </div>
      </div>
    </div>
  </section>

</main>

<footer id="footer" class="footer">
  <div class="container text-center">
    <p>© EV Analytics Dashboard Project</p>
  </div>
</footer>

<!-- Vendor JS -->
<script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="static/vendor/aos/aos.js"></script>

<!-- Main JS -->
<script src="static/js/main.js"></script>

<!-- OTP JS -->
<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
